name: Prospector Interno — CI & Publish GHCR

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ghcr-interno-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: "Quality Gate (PostgreSQL 16 Standalone + pytest)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d platform_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Initialize standalone PostgreSQL 16 schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5434 -U postgres -d platform_db -v ON_ERROR_STOP=1 -f migrations/standalone/000_init_standalone_schema.sql
          psql -h 127.0.0.1 -p 5434 -U postgres -d platform_db -v ON_ERROR_STOP=1 -f migrations/002_raw_data_prospector_evolution.sql

      - name: Install system utilities (poppler-utils) & Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run standalone & unit test suite
        run: pytest tests/ -m "not legacy_pg" -q

  publish-ghcr:
    name: "Build & Push GHCR"
    needs: quality-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
