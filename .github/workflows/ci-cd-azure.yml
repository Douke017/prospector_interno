name: Prospector Interno CI/CD — Quality Gate & Azure Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-build:
    name: "Quality Gate (225 Tests) & Docker Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest httpx openpyxl

      - name: Run full test suite (Isolated mode)
        run: pytest tests/ -q

      - name: Build production Docker image
        run: docker build -t ghcr.io/datax-bo/prospector-interno:latest .
