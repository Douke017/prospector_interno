[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prospector-interno"
version = "1.0.0"
description = "Arquitectura de Gestión, Custodia y Prospección Interna de Datos Financieros — DATAX"
authors = [
    { name = "DATAX Engineering", email = "ingenieria@datax.com.bo" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "duckdb>=1.1.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "legacy_pg: pruebas que requieren el volcado histórico legacy en platform_db (source/file/download)",
]
